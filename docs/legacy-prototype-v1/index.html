<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171817" />
    <meta name="description" content="超写实弹珠竞速游戏原型" />
    <title>弹珠竞速 · 工坊试跑</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='.32' cy='.25'%3E%3Cstop stop-color='%23dfffff'/%3E%3Cstop offset='.25' stop-color='%232bcbd0'/%3E%3Cstop offset='1' stop-color='%230b5965'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='25' fill='url(%23g)' stroke='%23f3ca7b' stroke-width='4'/%3E%3C/svg%3E" />
  </head>
  <body>
    <main id="game-shell">
      <canvas id="game" aria-label="实时三维弹珠比赛画面"></canvas>

      <header class="topbar">
        <div class="brand"><span class="brand-ball"></span><strong>弹珠竞速</strong><span>工坊试跑 01</span></div>
        <div class="stage"><span>赛段</span><strong id="stageText">准备区</strong></div>
        <button id="audioBtn" class="icon-btn" type="button" aria-label="开启或关闭声音">声音：开</button>
      </header>

      <aside class="leaderboard" aria-label="实时排名">
        <div class="panel-title"><span>实时排名</span><small id="raceClock">00:00.000</small></div>
        <ol id="rankList"></ol>
      </aside>

      <section class="focus-card" aria-live="polite">
        <span id="focusDot" class="focus-dot"></span>
        <div><small>关注弹珠</small><strong id="focusName">青岚</strong></div>
        <div class="speed"><strong id="speedText">0.0</strong><small>m/s</small></div>
      </section>

      <section class="controls" aria-label="比赛控制">
        <button id="startBtn" class="primary" type="button">开始比赛</button>
        <button id="pauseBtn" type="button" disabled>暂停</button>
        <button id="resetBtn" type="button">重置</button>
        <span class="divider"></span>
        <label>镜头
          <select id="cameraMode">
            <option value="follow">跟随</option>
            <option value="broadcast" selected>赛道</option>
            <option value="overhead">俯视</option>
            <option value="free">自由</option>
          </select>
        </label>
        <label>关注
          <select id="focusSelect" aria-label="选择关注弹珠"></select>
        </label>
      </section>

      <div id="countdown" class="countdown" aria-live="assertive"></div>
      <div id="finishCard" class="finish-card" hidden>
        <small>本场冠军</small>
        <h1 id="winnerName">—</h1>
        <p id="finishTime">—</p>
        <button id="raceAgainBtn" class="primary" type="button">再赛一场</button>
      </div>

      <div class="hint">拖动或缩放后保持自由视角 · 选择镜头可恢复自动跟拍 · 数字键 1–8 切换关注</div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
